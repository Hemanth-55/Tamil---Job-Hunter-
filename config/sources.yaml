# Employer job boards the scout reads directly.
# Every board was checked on 2026-11-25: it exists and belongs to the named organization.
# A posting found here comes straight from the employer's own hiring system, so it is real by construction.
# Add a board: find the company's careers page, note the ATS (greenhouse / lever / ashby / smartrecruiters / workday)
# and its slug, then run `python src/scout.py --check` to confirm it resolves.

